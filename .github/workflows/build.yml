name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并发布的目标 tag（如 v0.2.0）"
        required: true
  # release-please 用 GITHUB_TOKEN 创建 release，不会级联触发 push/release 事件，
  # 因此通过 workflow_run 在 release-please 跑完后接力构建最新 release。
  workflow_run:
    workflows: ["release-please"]
    types: [completed]

permissions:
  contents: write

jobs:
  resolve:
    name: 解析目标 tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      should_build: ${{ steps.tag.outputs.should_build }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          elif [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            TAG=$(gh release view --repo ${{ github.repository }} --json tagName -q .tagName 2>/dev/null || true)
            # 已有构建产物的 release 不重复构建
            if [ -n "$TAG" ]; then
              ASSETS=$(gh release view "$TAG" --repo ${{ github.repository }} --json assets -q '.assets | length')
              [ "$ASSETS" -gt 0 ] && TAG=""
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "should_build=$([ -n "$TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: image_core.exe
            archive: image_core-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: image_core
            archive: image_core-linux-x86_64.tar.gz
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: image_core
            archive: image_core-linux-x86_64-22.04.tar.gz
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            binary: image_core
            archive: image_core-linux-aarch64.tar.gz
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: image_core
            archive: image_core-macos-aarch64.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            binary: image_core
            archive: image_core-macos-x86_64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: image_webui/package-lock.json

      - name: Install webui dependencies
        working-directory: image_webui
        run: npm ci

      - name: Build webui (static export → image_webui/out/)
        working-directory: image_webui
        run: npm run build

      - name: Copy webui/out into image_core/assets/
        shell: bash
        run: |
          mkdir -p image_core/assets
          # Clear placeholder so we don't ship stale files in the binary.
          rm -rf image_core/assets/*
          cp -R image_webui/out/. image_core/assets/
          # Sanity-check: must contain index.html.
          test -f image_core/assets/index.html

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Cross-compile Linux ARM64 using the official target.
      - name: Install Rust target (cross)
        if: matrix.cross
        run: |
          rustup target add ${{ matrix.target }}
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            image_core/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('image_core/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.target }}-

      - name: Build (host)
        if: "!matrix.cross"
        working-directory: image_core
        run: cargo build --release

      - name: Build (cross)
        if: matrix.cross
        working-directory: image_core
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p release/${{ matrix.target }}
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp image_core/target/${{ matrix.cross && matrix.target || 'release' }}/${{ matrix.binary }} release/${{ matrix.target }}/
            cp image_core/README.md release/${{ matrix.target }}/
            (cd release/${{ matrix.target }} && 7z a ../${{ matrix.archive }} ${{ matrix.binary }} README.md) || (cd release/${{ matrix.target }} && zip -r ../${{ matrix.archive }} ${{ matrix.binary }} README.md)
          else
            cp image_core/target/${{ matrix.cross && matrix.target || 'release' }}/${{ matrix.binary }} release/${{ matrix.target }}/
            cp image_core/README.md release/${{ matrix.target }}/
            tar -czf release/${{ matrix.archive }} -C release/${{ matrix.target }} ${{ matrix.binary }} README.md
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: release/${{ matrix.archive }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: release/${{ matrix.archive }}
          fail_on_unmatched_files: true